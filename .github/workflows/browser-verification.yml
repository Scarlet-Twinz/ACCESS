name: ACCESS Browser Verification

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser verification
        run: npx playwright test
        env:
          PLAYWRIGHT_TEST_BASE_URL: \${{ github.event.deployment_status.target_url || 'https://scarlet-twinz.github.io/ACCESS/' }}
      - name: Upload browser report
        if: \${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: access-browser-report
          path: playwright-report/
