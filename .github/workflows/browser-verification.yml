name: ACCESS Browser Verification

on:
  deployment_status:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.deployment_status.state == 'success'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Inspect Pages deployment state
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pages/deployments/7b5ad449f7f9a22470ecb87335a989b700a7cdf3
      - name: Inspect recent Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run list --workflow deploy-pages.yml --limit 5 --json databaseId,status,conclusion,headSha,createdAt,url
      - name: Inspect Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pages
      - name: Check Pages URL variants
        run: |
          echo "Uppercase path:"
          curl -sS -L -o /tmp/access-upper.html -w "%{http_code} %{url_effective}\n" https://scarlet-twinz.github.io/ACCESS/
          echo "Lowercase path:"
          curl -sS -L -o /tmp/access-lower.html -w "%{http_code} %{url_effective}\n" https://scarlet-twinz.github.io/access/
      - name: Run browser verification
        run: npx playwright test
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://scarlet-twinz.github.io/ACCESS/
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: access-browser-report
          path: playwright-report/
